[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "valueinvestor"
version = "0.1.0"
description = "Automated Chinese stock value investing research and report generation tool"
requires-python = ">=3.9"
dependencies = [
    "akshare>=1.12.0",
    "yfinance>=0.2.30",
    "openai>=1.30.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "jinja2>=3.1.0",
    "typer[all]>=0.12.0",
    "weasyprint>=62.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "markdown>=3.6",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "google-genai>=1.0.0",
    "scipy>=1.10.0",
    "pyarrow>=14.0.0",
    "lightgbm>=4.6.0",
    "mlx>=0.31.0; python_version >= '3.10' and sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
]

[project.scripts]
valueinvestor = "valueinvestor.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
